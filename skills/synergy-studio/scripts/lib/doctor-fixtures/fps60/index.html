<!doctype html>
<!-- Doctor test page, local font only so nothing is fetched from the network; doctor copies gsap.min.js and doctor-sans.woff2 next to it. -->
<html><head><meta charset="UTF-8">
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:'DoctorSans';src:url('doctor-sans.woff2') format('woff2');font-weight:400}
html,body{margin:0;width:640px;height:360px;background:#101418;overflow:hidden}
#root{position:relative;width:640px;height:360px;font-family:'DoctorSans',sans-serif}
#scene{position:absolute;left:0;top:0;width:640px;height:360px}
#box{position:absolute;left:40px;top:130px;width:100px;height:100px;background:#e8a33d;border-radius:12px}
#label{position:absolute;left:0;right:0;top:40px;text-align:center;color:#f2f2f2;font-size:36px}
</style></head>
<body>
<div id="root" data-composition-id="main" data-width="640" data-height="360" data-fps="60" data-duration="1">
  <div id="scene" class="clip" data-start="0" data-duration="1" data-track-index="1">
    <div id="label">doctor 60 fps</div>
    <div id="box"></div>
  </div>
</div>
<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.to("#box", { x: 460, rotation: 90, duration: 1, ease: "none" }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body></html>
