<!doctype html>
<!-- Doctor test page, local font only so nothing is fetched from the network; doctor copies gsap.min.js, doctor-sans.woff2 and the three.js module files (three/three.module.js, three/three.core.js) next to it. -->
<html><head><meta charset="UTF-8">
<script src="gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"./three/three.module.js"}}</script>
<style>
@font-face{font-family:'DoctorSans';src:url('doctor-sans.woff2') format('woff2');font-weight:400}
html,body{margin:0;width:640px;height:360px;background:#101418;overflow:hidden}
#root{position:relative;width:640px;height:360px;font-family:'DoctorSans',sans-serif}
#scene{position:absolute;left:0;top:0;width:640px;height:360px}
#c3d{position:absolute;left:0;top:0}
</style></head>
<body>
<div id="root" data-composition-id="main" data-width="640" data-height="360" data-fps="30" data-duration="1">
  <div id="scene" class="clip" data-start="0" data-duration="1" data-track-index="1">
    <canvas id="c3d" width="640" height="360"></canvas>
  </div>
</div>
<script type="module">
import * as THREE from "three";
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c3d"), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(640, 360, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101418);
const light = new THREE.DirectionalLight(0xffffff, 2.5);
light.position.set(3, 4, 5);
scene.add(light, new THREE.AmbientLight(0xffffff, 0.6));
const cube = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), new THREE.MeshStandardMaterial({ color: 0xe8a33d, roughness: 0.4 }));
scene.add(cube);
const camera = new THREE.PerspectiveCamera(40, 640 / 360, 0.1, 50);
camera.position.set(0, 0.8, 5);
camera.lookAt(0, 0, 0);
const state = { t: 0 };
function draw() {
  cube.rotation.y = state.t * Math.PI * 1.5;
  cube.rotation.x = 0.4;
  renderer.render(scene, camera);
}
const tl = gsap.timeline({ paused: true });
tl.to(state, { t: 1, duration: 1, ease: "none", onUpdate: draw }, 0);
draw();
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body></html>
