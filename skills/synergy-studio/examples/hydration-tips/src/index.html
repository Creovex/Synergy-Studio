<!doctype html>
<html><head><meta charset="UTF-8">
<script src="gsap.min.js"></script>
<script src="timing.js"></script>
<script src="words.js"></script>
<script src="lib.js"></script>
<link rel="stylesheet" href="looks.css">
<style>
html,body{width:{{W}}px;height:{{H}}px}
#root{width:{{W}}px;height:{{H}}px}
.big{font-size:110px}
.tip{position:absolute;left:80px;top:230px;font-family:Manrope;font-weight:800;font-size:44px;color:var(--accent);letter-spacing:.08em}
.drop{position:absolute;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:linear-gradient(160deg,#7FE9FF,#2F7BFF)}
.fruit{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Manrope;font-weight:800;font-size:56px;color:#fff}
</style></head>
<body>
<div id="root" data-look="midnight" data-composition-id="main" data-width="{{W}}" data-height="{{H}}" data-fps="{{FPS}}" data-duration="{{TOTAL}}">

  <!-- s1 hook: clock at 3 pm + "you might just be thirsty" -->
  <div id="s1" class="scene clip" data-start="{{s1.start}}" data-duration="{{s1.dur}}" data-track-index="1">
    <div id="clock" class="abs" style="left:280px;top:360px;width:400px;height:400px;border-radius:50%;border:14px solid var(--ink)">
      <div id="hand1" class="abs" style="left:186px;top:60px;width:14px;height:140px;border-radius:7px;background:var(--ink);transform-origin:50% 100%"></div>
      <div id="hand2" class="abs" style="left:186px;top:186px;width:120px;height:14px;border-radius:7px;background:var(--accent);transform-origin:0 50%"></div>
    </div>
    <div id="s1a" class="abs h1" style="left:80px;right:200px;top:900px;text-align:center;font-size:94px;white-space:nowrap">Tired by 3 p.m.?</div>
    <div id="s1b" class="abs h1" style="left:80px;right:200px;top:1080px;text-align:center;font-size:68px;color:var(--accent)">You might just be thirsty.</div>
  </div>

  <!-- s2 tip 1: a glass fills up -->
  <div id="s2" class="scene clip" data-start="{{s2.start}}" data-duration="{{s2.dur}}" data-track-index="2">
    <div class="tip">TIP 1</div>
    <div class="abs h1" style="left:80px;right:200px;top:310px;font-size:80px">A full glass when you wake up.</div>
    <div class="abs" style="left:330px;top:820px;width:300px;height:460px;border:10px solid var(--ink);border-top:none;border-radius:0 0 40px 40px;overflow:hidden">
      <div id="water" class="abs" style="left:0;right:0;bottom:0;height:100%;background:linear-gradient(180deg,#7FE9FF,#2F7BFF);transform-origin:bottom"></div>
    </div>
    <div id="sun" class="abs" style="left:680px;top:760px;width:150px;height:150px;border-radius:50%;background:var(--accent3)"></div>
  </div>

  <!-- s3 tip 2: bottle in sight vs hidden -->
  <div id="s3" class="scene clip" data-start="{{s3.start}}" data-duration="{{s3.dur}}" data-track-index="3">
    <div class="tip">TIP 2</div>
    <div class="abs h1" style="left:80px;right:200px;top:310px;font-size:80px">Keep a bottle where you can see it.</div>
    <div id="bottle" class="abs" style="left:360px;top:760px;width:240px;height:560px;border-radius:60px 60px 40px 40px;background:linear-gradient(160deg,#7FE9FF,#2F7BFF)">
      <div class="abs" style="left:70px;top:-70px;width:100px;height:80px;border-radius:16px;background:var(--ink)"></div>
    </div>
    <div id="s3note" class="abs" style="left:80px;right:200px;top:1400px;text-align:center;font-size:48px;color:var(--muted)">Out of sight = out of mind</div>
  </div>

  <!-- s4 tip 3: water-rich foods with 90%+ counters -->
  <div id="s4" class="scene clip" data-start="{{s4.start}}" data-duration="{{s4.dur}}" data-track-index="4">
    <div class="tip">TIP 3</div>
    <div class="abs h1" style="left:80px;right:200px;top:310px;font-size:80px">Eat your water.</div>
    <div id="f1" class="fruit" style="left:90px;top:760px;width:360px;height:360px;background:#2FA84F"><span id="n1">0</span>%</div>
    <div id="f2" class="fruit" style="left:500px;top:760px;width:360px;height:360px;background:#FF4D6D"><span id="n2">0</span>%</div>
    <div id="l1" class="abs" style="left:90px;top:1150px;width:360px;text-align:center;font-size:44px;font-weight:600">Cucumber</div>
    <div id="l2" class="abs" style="left:500px;top:1150px;width:360px;text-align:center;font-size:44px;font-weight:600">Watermelon</div>
  </div>

  <!-- s5 CTA -->
  <div id="s5" class="scene clip" data-start="{{s5.start}}" data-duration="{{s5.dur}}" data-track-index="5">
    <div id="d1" class="drop" style="left:380px;top:560px;width:200px;height:260px"></div>
    <div id="s5a" class="abs h1 big" style="left:80px;right:200px;top:940px;text-align:center">Small sips,<br>all day.</div>
    <div id="s5b" class="abs" style="left:0;right:120px;top:1300px;text-align:center"><span id="follow" class="chip" style="font-size:44px;padding:22px 48px;background:var(--accent);border-color:var(--accent);color:#07101F">Follow for more tips</span></div>
  </div>

  <audio id="mix" src="audio/mix.wav" data-start="0" data-duration="{{TOTAL}}" data-track-index="99"></audio>
</div>
<script>
(function () {
  const {tl, V, S, at, rise, pop, press, count, finish} = SS.start();
  // s1: the clock hands sweep to 3 o'clock, then the question and the answer
  pop("#clock", S("s1", 0.2));
  tl.to("#hand2", {rotation: 360 + 0, duration: 1.6, ease: "power2.inOut"}, S("s1", 0.4));
  rise("#s1a", V("s1", 0.0)); rise("#s1b", V("s1", 1.4));
  // s2: glass fills while "a full glass" is said
  gsap.set("#water", {scaleY: 0});
  tl.to("#water", {scaleY: 0.85, duration: 1.6, ease: "power2.out"}, at("s2", "glass"));
  pop("#sun", V("s2", 0.2));
  // s3: bottle pops in on "keep a bottle", then the note
  pop("#bottle", at("s3", "bottle"));
  tl.to("#bottle", {rotation: -4, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3}, at("s3", "bottle") + 0.6);
  rise("#s3note", V("s3", 2.4));
  // s4: fruits pop on their names, counters to 96% and 92%
  pop("#f1", at("s4", "fruit1")); rise("#l1", at("s4", "fruit1") + 0.2);
  count("#n1", 0, 96, at("s4", "fruit1") + 0.1, 1.2);
  pop("#f2", at("s4", "fruit2")); rise("#l2", at("s4", "fruit2") + 0.2);
  count("#n2", 0, 92, at("s4", "fruit2") + 0.1, 1.2);
  // s5: a drop falls, the line and the CTA
  gsap.set("#d1", {y: -500, opacity: 0});
  tl.to("#d1", {y: 0, opacity: 1, duration: 0.8, ease: "bounce.out"}, S("s5", 0.2));
  rise("#s5a", V("s5", 0.1)); pop("#s5b", at("s5", "cta") - 0.3); press("#follow", at("s5", "cta"));
  finish();
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script>
</body></html>
