<!doctype html>
<html><head><meta charset="UTF-8">
<script src="gsap.min.js"></script>
<script src="timing.js"></script>
<script src="words.js"></script>
<script src="lib.js"></script>
<link rel="stylesheet" href="looks.css">
<style>
html,body{width:{{W}}px;height:{{H}}px}
#root{width:{{W}}px;height:{{H}}px;background:#000}
#base{position:absolute;left:0;top:0;width:{{W}}px;height:{{H}}px;object-fit:cover}
.tag{position:absolute;left:80px;top:300px;padding:18px 34px;border-radius:999px;background:var(--accent);color:#fff;font-family:Manrope;font-weight:800;font-size:46px}
</style></head>
<body>
<div id="root" data-look="bold" data-composition-id="main" data-width="{{W}}" data-height="{{H}}" data-fps="{{FPS}}" data-duration="{{TOTAL}}">
  <video id="base" src="assets/base.mp4" muted playsinline data-start="0" data-duration="{{TOTAL}}" data-track-index="0"></video>
  <div id="s1" class="scene clip" data-start="{{s1.start}}" data-duration="{{s1.dur}}" data-track-index="1">
    <div id="q" class="tag">Verified in under a second</div>
  </div>
  <div id="s2" class="scene clip" data-start="{{s2.start}}" data-duration="{{s2.dur}}" data-track-index="2">
    <div id="logo" class="tag" style="background:#111">Every medicine has a journey</div>
  </div>
  <audio id="mix" src="audio/mix.wav" data-start="0" data-duration="{{TOTAL}}" data-track-index="99"></audio>
</div>
<script>
(function () {
  const {tl, at, pop, punch, captions, finish} = SS.start();
  pop("#q", at("s1", "q")); pop("#logo", at("s2", "logo"));
  punch("#base", 7.8);                                 // zoom punch on the cut
  captions({top: "70%", size: 76, highlight: "#FFE14D"});
  finish();
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
})();
</script>
</body></html>
